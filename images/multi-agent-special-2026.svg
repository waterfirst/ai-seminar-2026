<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <rect x="40" y="40" width="1520" height="820" rx="28" fill="#FFFFFF" stroke="#D6E0F5"/>
  <text x="90" y="110" fill="#0F172A" font-family="Arial, sans-serif" font-size="42" font-weight="700">3차 세미나 특별편 — 단독 에이전트 vs 멀티에이전트</text>
  <text x="90" y="150" fill="#475569" font-family="Arial, sans-serif" font-size="22">실험 기준: 세미나 자료 제작·정리·배포 흐름 / 삼성디스플레이 품질팀 적용판</text>

  <rect x="90" y="190" width="680" height="250" rx="22" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="120" y="235" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="28" font-weight="700">A. 단순 수정 — Codex 단독이 더 빠르다</text>
  <rect x="120" y="260" width="290" height="145" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="145" y="295" fill="#0F172A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Codex 단독</text>
  <text x="145" y="330" fill="#334155" font-family="Arial, sans-serif" font-size="20">문구 수정 / 접기 추가 / 밝은 톤 정리</text>
  <text x="145" y="360" fill="#334155" font-family="Arial, sans-serif" font-size="20">파일 찾기 → 수정 → 확인까지 한 흐름</text>
  <text x="145" y="390" fill="#16A34A" font-family="Arial, sans-serif" font-size="19" font-weight="700">작고 명확한 작업의 기본 경로</text>

  <rect x="430" y="260" width="310" height="145" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="455" y="295" fill="#0F172A" font-family="Arial, sans-serif" font-size="24" font-weight="700">멀티에이전트</text>
  <text x="455" y="330" fill="#334155" font-family="Arial, sans-serif" font-size="20">역할 설명 / 컨텍스트 전달 / 결과 취합 필요</text>
  <text x="455" y="360" fill="#334155" font-family="Arial, sans-serif" font-size="20">작은 수정에는 오히려 부담이 커짐</text>
  <text x="455" y="390" fill="#DC2626" font-family="Arial, sans-serif" font-size="19" font-weight="700">가벼운 일에는 과한 비용</text>

  <rect x="90" y="470" width="680" height="310" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="120" y="515" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700">B. 자료 제작 — 멀티에이전트가 더 자연스럽다</text>
  <text x="120" y="560" fill="#334155" font-family="Arial, sans-serif" font-size="22">• Gemini: 최신 뉴스·외부 사례·링크 확인</text>
  <text x="120" y="600" fill="#334155" font-family="Arial, sans-serif" font-size="22">• Z AI: 초안 문장, 짧은 요약, 대안 표현 생성</text>
  <text x="120" y="640" fill="#334155" font-family="Arial, sans-serif" font-size="22">• Codex: HTML/MD 반영, 구조 정리, 중복 제거, 배포</text>
  <text x="120" y="680" fill="#334155" font-family="Arial, sans-serif" font-size="22">• 사람: 마지막 순서·메시지·승인 확인</text>
  <text x="120" y="730" fill="#1E293B" font-family="Arial, sans-serif" font-size="22" font-weight="700">핵심: 가벼운 일과 무거운 일을 같은 방식으로 처리하지 않는다.</text>

  <rect x="820" y="190" width="690" height="590" rx="22" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="850" y="235" fill="#B45309" font-family="Arial, sans-serif" font-size="28" font-weight="700">C. 이 특별편에서 확인한 운영 원칙</text>
  <rect x="850" y="265" width="630" height="88" rx="16" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="875" y="300" fill="#0F172A" font-family="Arial, sans-serif" font-size="23" font-weight="700">1. 작고 명확한 수정은 Codex 단독이 대체로 더 경제적</text>
  <text x="875" y="332" fill="#475569" font-family="Arial, sans-serif" font-size="18">여러 모델을 붙일수록 설명 비용과 취합 비용이 커진다.</text>

  <rect x="850" y="372" width="630" height="88" rx="16" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="875" y="407" fill="#0F172A" font-family="Arial, sans-serif" font-size="23" font-weight="700">2. 자료 제작과 배포는 멀티에이전트 가치가 커진다</text>
  <text x="875" y="439" fill="#475569" font-family="Arial, sans-serif" font-size="18">탐색, 초안, 통합을 분리하는 편이 더 안정적이다.</text>

  <rect x="850" y="479" width="630" height="88" rx="16" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="875" y="514" fill="#0F172A" font-family="Arial, sans-serif" font-size="23" font-weight="700">3. 마지막 종료 판단은 사람에게 남겨야 한다</text>
  <text x="875" y="546" fill="#475569" font-family="Arial, sans-serif" font-size="18">자동화가 커질수록 메시지와 배포 판단은 사람이 잡아야 한다.</text>

  <rect x="850" y="586" width="630" height="158" rx="16" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="875" y="621" fill="#0F172A" font-family="Arial, sans-serif" font-size="23" font-weight="700">4. 멀티에이전트란 “항상 여러 모델”이 아니라 단계별 분업이다</text>
  <text x="875" y="656" fill="#475569" font-family="Arial, sans-serif" font-size="18">가벼운 일과 무거운 일을 다르게 운영하는 것이 핵심 설계다.</text>
  <text x="875" y="696" fill="#0F172A" font-family="Arial, sans-serif" font-size="24" font-weight="700">정리: 단순 수정은 단독, 자료 제작은 멀티,</text>
  <text x="875" y="728" fill="#0F172A" font-family="Arial, sans-serif" font-size="24" font-weight="700">마지막 판단은 사람이 잡는다.</text>

  <text x="90" y="825" fill="#64748B" font-family="Arial, sans-serif" font-size="18">실무 요약: 작은 일은 단독, 자료 제작은 분업, 배포 전 종료 판단은 사람이 유지한다.</text>
</svg>
